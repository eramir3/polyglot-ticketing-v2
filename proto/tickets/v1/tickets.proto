syntax = "proto3";

package tickets.v1;

import "buf/validate/validate.proto";

option go_package = "polyglot-ticketing-v2/protogen/go/tickets/v1;ticketsv1";

service TicketsService {
  rpc CreateTicket(CreateTicketRequest) returns (CreateTicketResponse);
  rpc UpdateTicket(UpdateTicketRequest) returns (UpdateTicketResponse);
  rpc GetTicket(GetTicketRequest) returns (GetTicketResponse);
  rpc ListTickets(ListTicketsRequest) returns (ListTicketsResponse);
  // Internal Orders-to-Tickets reservation operations. They are intentionally
  // not exposed through the API gateway.
  rpc ReserveTicketForOrder(ReserveTicketForOrderRequest) returns (ReserveTicketForOrderResponse);
  rpc ReleaseTicketReservation(ReleaseTicketReservationRequest) returns (ReleaseTicketReservationResponse);
}

message CreateTicketRequest {
  string title = 1;
  int64 price = 2;
  string user_id = 3;
  optional string idempotency_key = 4;
}

message CreateTicketResponse {
  string id = 1;
  string title = 2;
  int64 price = 3;
  string user_id = 4;
}

message UpdateTicketRequest {
  string id = 1;
  string title = 2;
  int64 price = 3;
  string user_id = 4;
  string idempotency_key = 5;
}

message UpdateTicketResponse {
  Ticket ticket = 1;
}

message GetTicketRequest {
  string id = 1;
}

message GetTicketResponse {
  Ticket ticket = 1;
}

message ListTicketsRequest {}

message ListTicketsResponse {
  repeated Ticket tickets = 1;
}

message ReserveTicketForOrderRequest {
  string ticket_id = 1 [(buf.validate.field).string.uuid = true];
  string order_id = 2 [(buf.validate.field).string.uuid = true];
}

message ReserveTicketForOrderResponse {}

message ReleaseTicketReservationRequest {
  string ticket_id = 1 [(buf.validate.field).string.uuid = true];
  string order_id = 2 [(buf.validate.field).string.uuid = true];
}

message ReleaseTicketReservationResponse {}

message Ticket {
  string id = 1;
  string title = 2;
  int64 price = 3;
  string user_id = 4;
}
