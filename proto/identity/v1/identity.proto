syntax = "proto3";

package identity.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "polyglot-ticketing-v1/protogen/go/identity/v1;identityv1";

service IdentityService {
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc SignIn(SignInRequest) returns (SignInResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  rpc CurrentUser(CurrentUserRequest) returns (CurrentUserResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
}

message SignUpRequest {
  string name = 1 [(buf.validate.field).string.pattern = ".*\\S.*"];
  string email = 2 [(buf.validate.field).string.email = true];
  string password = 3 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}

message SignUpResponse {
  string user_id = 1;
  string email = 2;
}

message SignInRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}

message SignInResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  string session_token = 5;
  google.protobuf.Timestamp session_expires_at = 6;
}

message SignOutRequest {}

message SignOutResponse {}

message CurrentUserRequest {}

message CurrentUserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
}

message VerifyEmailRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

message VerifyEmailResponse {
  bool verified = 1;
}
