services:
  temporal:
    image: temporalio/temporal:1.9.1
    command:
      [
        'server',
        'start-dev',
        '--ip',
        '0.0.0.0',
        '--db-filename',
        '/home/temporal/temporal.db',
      ]
    ports:
      - '7233:7233'
      - '8233:8233'
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test:
        [
          'CMD',
          'temporal',
          'operator',
          'cluster',
          'health',
          '--address',
          '127.0.0.1:7233',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal-namespace:
    image: temporalio/temporal:1.9.1
    command:
      [
        'operator',
        'namespace',
        'update',
        '--address',
        'temporal:7233',
        '--namespace',
        'default',
        '--retention',
        '168h',
      ]
    depends_on:
      temporal:
        condition: service_healthy
    restart: 'no'

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile.dev
    image: api-gateway:dev
    container_name: api-gateway
    environment:
      NODE_ENV: development
      PORT: 3000
      IDENTITY_GRPC_URL: identity:50051
      ORDERS_GRPC_URL: orders:50053
      TICKETS_GRPC_URL: tickets:50052
      TICKETING_USER_APP_ORIGIN: ${TICKETING_USER_APP_ORIGIN:-http://localhost:3001}
    ports:
      - '3000:3000'
    expose:
      - '9090'
    depends_on:
      - identity
      - orders
      - tickets

  identity:
    build:
      context: .
      dockerfile: apps/identity/Dockerfile.dev
    image: identity:dev
    container_name: identity
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}@identity-db:5432/identity-db
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-http://localhost:3000/api/auth/verify-email}
      NODE_ENV: development
      GRPC_PORT: 50051
      SMTP_FROM: ${SMTP_FROM:-no-reply@polyglot-ticketing.local}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      TICKETING_USER_APP_ORIGIN: ${TICKETING_USER_APP_ORIGIN:-http://localhost:3001}
    depends_on:
      identity-db:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    expose:
      - '50051'
      - '9090'

  identity-migrate:
    image: identity:dev
    container_name: identity-migrate
    command: ['node', 'dist/apps/identity/apps/identity/src/migrate.js']
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be set}
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}@identity-db:5432/identity-db
      SMTP_FROM: ${SMTP_FROM:-no-reply@polyglot-ticketing.local}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      identity-db:
        condition: service_healthy
    restart: 'no'

  identity-db:
    image: postgres:17-alpine
    container_name: identity-db
    environment:
      POSTGRES_DB: identity-db
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}
      POSTGRES_USER: identity
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U identity -d identity-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - identity-db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.28
    container_name: mailpit
    ports:
      - '8025:8025'
    expose:
      - '1025'

  tickets:
    build:
      context: .
      dockerfile: apps/tickets/Dockerfile.dev
    image: tickets:dev
    container_name: tickets
    environment:
      DATABASE_URL: postgresql://tickets:${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}@tickets-db:5432/tickets-db?sslmode=disable
      GRPC_PORT: 50052
      ORDERS_GRPC_URL: orders:50053
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      TEMPORAL_TASK_QUEUE: ticket-creation
    depends_on:
      temporal-namespace:
        condition: service_completed_successfully
      orders:
        condition: service_started
      tickets-db:
        condition: service_healthy
      tickets-migrate:
        condition: service_completed_successfully
    expose:
      - '50052'
  tickets-migrate:
    build:
      context: .
      dockerfile: apps/tickets/Dockerfile.dev
    image: tickets-migrate:dev
    container_name: tickets-migrate
    command: ['tickets-migrate']
    environment:
      DATABASE_URL: postgresql://tickets:${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}@tickets-db:5432/tickets-db?sslmode=disable
    depends_on:
      tickets-db:
        condition: service_healthy
    restart: 'no'

  tickets-db:
    image: postgres:17-alpine
    container_name: tickets-db
    environment:
      POSTGRES_DB: tickets-db
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:?TICKETS_DB_PASSWORD must be set}
      POSTGRES_USER: tickets
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tickets -d tickets-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5433:5432'
    volumes:
      - tickets-db-data:/var/lib/postgresql/data

  orders:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile.dev
    image: orders:dev
    container_name: orders
    environment:
      DATABASE_URL: postgresql://orders:${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}@orders-db:5432/orders-db?sslmode=disable
      GRPC_PORT: 50053
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      ORDERS_TEMPORAL_TASK_QUEUE: order-reservation
      TICKETS_GRPC_URL: tickets:50052
    depends_on:
      orders-db:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
      temporal-namespace:
        condition: service_completed_successfully
    expose:
      - '50053'

  orders-migrate:
    build:
      context: .
      dockerfile: apps/orders/Dockerfile.dev
    image: orders-migrate:dev
    container_name: orders-migrate
    command: ['orders-migrate']
    environment:
      DATABASE_URL: postgresql://orders:${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}@orders-db:5432/orders-db?sslmode=disable
    depends_on:
      orders-db:
        condition: service_healthy
    restart: 'no'

  orders-db:
    image: postgres:17-alpine
    container_name: orders-db
    environment:
      POSTGRES_DB: orders-db
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}
      POSTGRES_USER: orders
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U orders -d orders-db']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5434:5432'
    volumes:
      - orders-db-data:/var/lib/postgresql/data

volumes:
  temporal-data:
  identity-db-data:
  orders-db-data:
  tickets-db-data:
